<!-- src/app/shared/components/aviso-login/aviso-login.component.html -->
@if (visible) {
  <div class="aviso-login" role="alert">

    <!-- Icono SVG candado -->
    <span class="aviso-login__icon" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </span>

    <!-- Texto -->
    <div class="aviso-login__text">
      <strong class="aviso-login__title">{{ titulo }}</strong>
      <span class="aviso-login__msg">{{ mensaje }}</span>
    </div>

    <!-- Botón principal -->
    <button type="button" class="aviso-login__btn" (click)="onIrAlLogin()">
      {{ textoBoton }}
    </button>

    <!-- Cerrar -->
    <button
      type="button"
      class="aviso-login__close"
      (click)="onCerrar()"
      aria-label="Cerrar aviso">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>

  </div>
}
