<div class="sticker-picker" (click)="$event.stopPropagation()">

  <div class="sticker-picker__header">
    <div class="sticker-picker__tabs">
      <button class="sticker-tab"
              [class.sticker-tab--active]="tabActivo() === 'mios'"
              (click)="cambiarTab('mios')">
        Mis stickers
      </button>
      <button class="sticker-tab"
              [class.sticker-tab--active]="tabActivo() === 'publicos'"
              (click)="cambiarTab('publicos')">
        Públicos
      </button>
    </div>
    <button class="sticker-picker__close" (click)="cerrarPanel()" title="Cerrar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <div class="sticker-picker__search">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input type="text" placeholder="Buscar sticker..."
           [value]="busqueda()"
           (input)="onBusquedaChange($any($event.target).value)">
  </div>

  <div class="sticker-picker__body">
    @if (stickersMostrados.length === 0) {
      <div class="sticker-picker__empty">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="18" height="18" rx="4"/>
          <circle cx="9" cy="9" r="2"/>
          <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
        </svg>
        <p>
          @if (tabActivo() === 'mios') {
            Aún no tienes stickers
          } @else {
            No hay stickers públicos
          }
        </p>
      </div>
    } @else {
      <div class="sticker-grid">
        @for (s of stickersMostrados; track s.id) {
          <button class="sticker-item" (click)="seleccionar(s)" [title]="s.nombre">
            <img [src]="s.urlImagen" [alt]="s.nombre" loading="lazy">
          </button>
        }
      </div>
    }
  </div>

  <div class="sticker-picker__footer">
    <button class="sticker-btn-crear" (click)="abrirCrear()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      Crear sticker
    </button>
  </div>
</div>
