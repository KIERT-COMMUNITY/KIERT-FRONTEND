<!-- src/app/shared/components/floating-social/floating-social.component.html -->

<!-- ===== REDES SOCIALES ===== -->
@if (showSocial()) {
  <div class="floating-social">
    <button class="floating-social__close" (click)="closeSocial()" aria-label="Cerrar redes sociales">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
    <div class="floating-social__title">
      <span>Conéctate con nosotros</span>
    </div>
    <div class="floating-social__grid">
      @for (link of socialLinks(); track link.id) {
        <a [href]="link.url"
           target="_blank"
           rel="noopener noreferrer"
           class="floating-social__link"
           [style.background]="link.bgColor"
           [attr.title]="link.name">
          <span class="social-icon" [innerHTML]="link.icon | safeHtml"></span>
        </a>
      }
    </div>
    <div class="floating-social__footer">
      <span>Únete a la comunidad</span>
    </div>
  </div>
}
