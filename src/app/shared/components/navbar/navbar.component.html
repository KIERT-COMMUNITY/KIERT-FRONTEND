<!-- navbar.component.html -->
<header class="navbar">
  <div class="navbar-container">

    <!-- LOGO -->
    <a routerLink="/comunidad" class="navbar-brand">
      <span class="brand-prompt">&gt;_</span>
      <span class="brand-name">kiert</span>
    </a>

    <!-- BOTON HAMBURGUESA -->
    <button
      class="navbar-toggle"
      type="button"
      (click)="alternarMenu()"
      [attr.aria-expanded]="menuAbierto()"
      aria-label="Abrir menú"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- MENU -->
    <nav class="navbar-links" [class.is-open]="menuAbierto()">
      <!-- Comunidad -->
      <a 
        routerLink="/comunidad" 
        routerLinkActive="active" 
        [routerLinkActiveOptions]="{exact: true}" 
        (click)="cerrarMenu()"
      >
        Comunidad
      </a>
      
      <!-- Publicar -->
      <a 
        routerLink="/comunidad/nueva-publicacion" 
        routerLinkActive="active" 
        (click)="cerrarMenu()"
      >
        Publicar
      </a>
      
      <!-- Mis publicaciones -->
      <a 
        routerLink="/mis-publicaciones" 
        routerLinkActive="active" 
        (click)="cerrarMenu()"
      >
        Mis publicaciones
      </a>

      <!-- CHAT CON CONTADOR -->
      <a 
        (click)="irAlChat()" 
        routerLinkActive="active" 
        class="nav-link-chat" 
        style="cursor: pointer;"
      >
        <span>Chat</span>
        @if (mensajesNoLeidos() > 0) {
          <span class="badge-notificacion">{{ mensajesNoLeidos() }}</span>
        }
      </a>

      <!-- ✅ NOTIFICACIONES (NUEVO) -->
      <kiert-notificaciones />

      <!-- Perfil -->
      <a 
        routerLink="/perfil" 
        routerLinkActive="active" 
        (click)="cerrarMenu()"
      >
        Perfil
      </a>

      <!-- Ajustes -->
      <a 
        routerLink="/ajustes" 
        routerLinkActive="active" 
        (click)="cerrarMenu()"
      >
        Ajustes
      </a>

      <!-- Cerrar sesión -->
      <button class="btn-logout" (click)="cerrarSesion()">
        Cerrar sesión
      </button>
    </nav>
  </div>
</header>
