<header
  class="navbar"
  [class.menu-abierto]="menuAbierto()"
  [class.menu-contraido]="menuContraido()"
>
  <div class="navbar-mobile-header">
    <a
      routerLink="/comunidad"
      class="navbar-brand"
      aria-label="Ir a Comunidad"
      (click)="cerrarMenu()"
    >
      <span class="brand-prompt">&gt;_</span>
      <span class="brand-name">kiert</span>
    </a>

    <button
      type="button"
      class="navbar-toggle"
      aria-label="Abrir o cerrar menu"
      [attr.aria-expanded]="menuAbierto()"
      [class.is-active]="menuAbierto()"
      (click)="alternarMenu()"
    >
      <span class="toggle-line"></span>
      <span class="toggle-line"></span>
      <span class="toggle-line"></span>
    </button>
  </div>

  <div class="navbar-container">
    <div class="sidebar-header">
      <a
        routerLink="/comunidad"
        class="navbar-brand sidebar-brand"
        aria-label="Ir a Comunidad"
        title="KIERT"
      >
        <span class="brand-prompt">&gt;_</span>
        <span class="brand-name">kiert</span>
      </a>

      <button
        type="button"
        class="collapse-button"
        [attr.aria-label]="menuContraido() ? 'Expandir menu lateral' : 'Contraer menu lateral'"
        [attr.title]="menuContraido() ? 'Expandir menu' : 'Contraer menu'"
        (click)="alternarMenuContraido()"
      >
        @if (menuContraido()) {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        }
      </button>
    </div>

    <nav class="navbar-menu" aria-label="Navegacion principal">
      <div class="navbar-menu-inner">
        <div class="menu-section">
          <span class="menu-section-title">Menu principal</span>

          <a routerLink="/comunidad" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="menu-item" title="Comunidad" (click)="cerrarMenu()">
            <span class="menu-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
              </svg>
            </span>
            <span class="menu-label">Comunidad</span>
          </a>

          <a routerLink="/comunidad/nueva-publicacion" routerLinkActive="active" class="menu-item" title="Publicar" (click)="cerrarMenu()">
            <span class="menu-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
            </span>
            <span class="menu-label">Publicar</span>
          </a>

          <a routerLink="/mis-publicaciones" routerLinkActive="active" class="menu-item" title="Mis publicaciones" (click)="cerrarMenu()">
            <span class="menu-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
            <span class="menu-label">Mis publicaciones</span>
          </a>

          <a routerLink="/documentos" routerLinkActive="active" class="menu-item" title="Documentos" (click)="cerrarMenu()">
            <span class="menu-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
              </svg>
            </span>
            <span class="menu-label">Documentos</span>
          </a>

          <a routerLink="/biblioteca" routerLinkActive="active" class="menu-item" title="Biblioteca" (click)="cerrarMenu()">
            <span class="menu-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
              </svg>
            </span>
            <span class="menu-label">Biblioteca</span>
          </a>
        </div>

        <div class="menu-section">
          <span class="menu-section-title">Comunicacion</span>

          <button type="button" class="menu-item menu-button" title="Chat" (click)="irAlChat()">
            <span class="menu-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
              </svg>
            </span>
            <span class="menu-label">Chat</span>
            @if (mensajesNoLeidos() > 0) {
              <span class="menu-badge" [attr.aria-label]="mensajesNoLeidos() + ' mensajes no leidos'">
                {{ mensajesNoLeidos() > 99 ? '99+' : mensajesNoLeidos() }}
              </span>
            }
          </button>

          <div class="menu-item-notificaciones" title="Notificaciones">
            <kiert-notificaciones></kiert-notificaciones>
          </div>
        </div>

        <div class="menu-section">
          <span class="menu-section-title">Mi cuenta</span>

          <a routerLink="/perfil" routerLinkActive="active" class="menu-item" title="Perfil" (click)="cerrarMenu()">
            <span class="menu-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
            <span class="menu-label">Perfil</span>
          </a>

          <a routerLink="/ajustes" routerLinkActive="active" class="menu-item" title="Ajustes" (click)="cerrarMenu()">
            <span class="menu-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
              </svg>
            </span>
            <span class="menu-label">Ajustes</span>
          </a>
        </div>
      </div>

      <div class="navbar-footer">
        <button type="button" class="menu-item btn-logout" title="Cerrar sesion" (click)="cerrarSesion()">
          <span class="menu-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
          </span>
          <span class="menu-label">Cerrar sesion</span>
        </button>
      </div>
    </nav>
  </div>
</header>

@if (menuAbierto()) {
  <button type="button" class="navbar-overlay" aria-label="Cerrar menu" (click)="cerrarMenu()"></button>
}
