<!-- navbar.component.html -->
<header class="navbar">
  <div class="navbar-container">

    <!-- LOGO -->
    <a routerLink="/comunidad" class="navbar-brand">
      <span class="brand-prompt">&gt;_</span>
      <span class="brand-name">kiert</span>
    </a>

    <!-- BOTON HAMBURGUESA -->
    <button
      class="navbar-toggle"
      type="button"
      (click)="alternarMenu()"
      [attr.aria-expanded]="menuAbierto()"
      aria-label="Abrir menú"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- MENU -->
    <nav class="navbar-links" [class.is-open]="menuAbierto()">
      <!-- Comunidad -->
      <a 
        routerLink="/comunidad" 
        routerLinkActive="active" 
        [routerLinkActiveOptions]="{exact: true}" 
        (click)="cerrarMenu()"
      >
        Comunidad
      </a>
      
      <!-- Publicar -->
      <a 
        routerLink="/comunidad/nueva-publicacion" 
        routerLinkActive="active" 
        (click)="cerrarMenu()"
      >
        Publicar
      </a>
      
      <!-- Mis publicaciones -->
      <a 
        routerLink="/mis-publicaciones" 
        routerLinkActive="active" 
        (click)="cerrarMenu()"
      >
        Mis publicaciones
      </a>

      <!-- ✅ DOCUMENTOS -->
      <a 
        routerLink="/documentos" 
        routerLinkActive="active" 
        (click)="cerrarMenu()"
        class="nav-link-documentos"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10 9 9 9 8 9"/>
        </svg>
        Documentos
      </a>

      <!-- ✅ BIBLIOTECA (NUEVO) -->
      <a 
        routerLink="/biblioteca" 
        routerLinkActive="active" 
        (click)="cerrarMenu()"
        class="nav-link-biblioteca"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          <line x1="8" y1="7" x2="16" y2="7"/>
          <line x1="8" y1="11" x2="16" y2="11"/>
          <line x1="8" y1="15" x2="12" y2="15"/>
        </svg>
        Biblioteca
      </a>

      <!-- CHAT CON CONTADOR -->
      <a 
        (click)="irAlChat()" 
        routerLinkActive="active" 
        class="nav-link-chat" 
        style="cursor: pointer;"
      >
        <span>Chat</span>
        @if (mensajesNoLeidos() > 0) {
          <span class="badge-notificacion">{{ mensajesNoLeidos() }}</span>
        }
      </a>

      <!-- NOTIFICACIONES -->
      <kiert-notificaciones />

      <!-- Perfil -->
      <a 
        routerLink="/perfil" 
        routerLinkActive="active" 
        (click)="cerrarMenu()"
      >
        Perfil
      </a>

      <!-- Ajustes -->
      <a 
        routerLink="/ajustes" 
        routerLinkActive="active" 
        (click)="cerrarMenu()"
      >
        Ajustes
      </a>

      <!-- Cerrar sesión -->
      <button class="btn-logout" (click)="cerrarSesion()">
        Cerrar sesión
      </button>
    </nav>
  </div>
</header>
