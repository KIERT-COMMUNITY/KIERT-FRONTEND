<!-- login.component.html -->
<div class="login-page">
  
  <!-- HEADER -->
  <div class="login-header">
    <img src="/assets/logokiert.png" alt="Kiert" class="login-logo">
    <div class="login-header-text">
      <span class="login-prompt">&gt;_</span>
      <span class="login-name">kiert</span>
    </div>
    <p class="login-desc">Comunidad para compartir casos y ayudarse</p>
  </div>

  <!-- FORMULARIO -->
  <form [formGroup]="form" (ngSubmit)="enviar()" novalidate class="login-form">

    <div class="field">
      <input
        id="email"
        type="email"
        formControlName="email"
        placeholder="Correo electrónico"
        [class.is-invalid]="email.invalid && email.touched"
        autocomplete="email"
      >
      @if (email.invalid && email.touched) {
        <span class="error-msg">Correo inválido</span>
      }
    </div>

    <div class="field">
      <input
        id="password"
        type="password"
        formControlName="password"
        placeholder="Contraseña"
        [class.is-invalid]="password.invalid && password.touched"
        autocomplete="current-password"
      >
      @if (password.invalid && password.touched) {
        <span class="error-msg">Mínimo 8 caracteres</span>
      }
    </div>

    <div class="field-options">
      <a routerLink="/recuperar-contrasena" class="forgot-link">¿Olvidaste tu contraseña?</a>
    </div>

    @if (errorMsg()) {
      <p class="form-alert">{{ errorMsg() }}</p>
    }

    <button type="submit" class="login-btn" [disabled]="cargando()">
      {{ cargando() ? 'Ingresando...' : 'Iniciar sesión' }}
    </button>

    <p class="register-link">
      ¿No tienes cuenta? <a routerLink="/registro">Regístrate</a>
    </p>
  </form>
</div>
