<!-- forgot-password.component.html -->
<div class="forgot-page">
  
  <!-- HEADER -->
  <div class="forgot-header">
    <img src="/assets/logokiert.png" alt="Kiert" class="forgot-logo">
    <div class="forgot-header-text">
      <span class="forgot-prompt">&gt;_</span>
      <span class="forgot-name">kiert</span>
    </div>
    <p class="forgot-desc">Recupera el acceso a tu cuenta</p>
  </div>

  <!-- FORMULARIO -->
  @if (!enviado()) {
    <form [formGroup]="form" (ngSubmit)="enviar()" novalidate class="forgot-form">

      <div class="field">
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="Correo electrónico"
          [class.is-invalid]="email.invalid && email.touched"
        >
        @if (email.invalid && email.touched) {
          <span class="error-msg">Correo inválido</span>
        }
      </div>

      <button type="submit" class="forgot-btn" [disabled]="cargando()">
        {{ cargando() ? 'Enviando...' : 'Enviar enlace de recuperación' }}
      </button>
    </form>
  } @else {
    <div class="forgot-success">
      <p>Si el correo está registrado, te enviamos un enlace para restablecer tu contraseña.</p>
      <p class="forgot-success-small">Revisa tu bandeja de entrada (y spam).</p>
    </div>
  }

  <p class="forgot-back">
    <a routerLink="/login">Volver a iniciar sesión</a>
  </p>
</div>
