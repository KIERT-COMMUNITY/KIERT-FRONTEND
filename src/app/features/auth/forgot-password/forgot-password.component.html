<h1 class="form-title">Recuperar contraseña</h1>

@if (!enviado()) {
  <form [formGroup]="form" (ngSubmit)="enviar()" novalidate>
    <div class="field">
      <label for="email">Tu correo registrado</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        placeholder="tucorreo@ejemplo.com"
        [class.is-invalid]="email.invalid && email.touched"
      >
      @if (email.invalid && email.touched) {
        <span class="error-msg">Ingresa un correo válido.</span>
      }
    </div>

    <button type="submit" class="btn btn--primary form-submit" [disabled]="cargando()">
      {{ cargando() ? 'Enviando...' : 'Enviar enlace de recuperación' }}
    </button>
  </form>
} @else {
  <p class="form-success">
    Si el correo está registrado, te enviamos un enlace para restablecer tu contraseña. Revisa tu bandeja de entrada (y spam).
  </p>
}

<div class="form-links">
  <a routerLink="/login">Volver a iniciar sesión</a>
</div>
