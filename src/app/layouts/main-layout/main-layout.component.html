
<div class="app-container">

  <!-- ===== SKIP LINK (accesibilidad teclado) ===== -->
  <a href="#main-content" class="skip-link">
    Saltar al contenido principal
  </a>

  <div class="app-shell" [class.sidebar-collapsed]="menuContraido()">
    <kiert-navbar
      (estadoContraidoChange)="actualizarEstadoMenu($event)"
    ></kiert-navbar>

    <div class="app-main">
      <div class="main-banner">
        <div class="main-banner__content">
          <div class="main-banner__image">
            <img
              src="assets/images/anuncio/bannergood.jpg"
              alt="Kiert Banner"
              loading="lazy"
              (error)="onBannerError($event)"
            >
          </div>

          <div class="main-banner__overlay">
            <h2>Únete a la comunidad</h2>
            <p>Comparte tus proyectos, aprende de otros y crece profesionalmente</p>
            <a routerLink="/comunidad" class="main-banner__btn">
              Explorar ahora
            </a>
          </div>
        </div>
      </div>

      <main class="main-content" id="main-content" role="main" tabindex="-1">
        <router-outlet></router-outlet>
      </main>

      <kiert-footer></kiert-footer>
      <kiert-floating-social></kiert-floating-social>
    </div>
  </div>

  <!-- ===== MODAL DE AYUDA DE ATAJOS ===== -->
  <kiert-keyboard-help></kiert-keyboard-help>

  <!-- ===== FAB (botón flotante) para abrir ayuda ===== -->
  <button
    class="kbd-fab"
    type="button"
    (click)="abrirAyudaAtajos()"
    title="Atajos de teclado (Shift + ?)"
    aria-label="Ver atajos de teclado"
  >
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="6" width="20" height="12" rx="2"/>
      <line x1="6" y1="10" x2="6" y2="10"/>
      <line x1="10" y1="10" x2="10" y2="10"/>
      <line x1="14" y1="10" x2="14" y2="10"/>
      <line x1="18" y1="10" x2="18" y2="10"/>
      <line x1="7" y1="14" x2="17" y2="14"/>
    </svg>
  </button>
</div>
