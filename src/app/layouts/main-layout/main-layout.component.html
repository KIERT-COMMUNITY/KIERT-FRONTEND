<!-- src/app/layouts/main-layout/main-layout.component.html -->
<div class="app-container" [class.chat-route]="esRutaChat()">

  <!-- SKIP LINK (accesibilidad teclado) -->
  <a
    href="#main-content"
    class="skip-link"
    aria-label="Saltar al contenido principal"
  >
    Saltar al contenido principal
  </a>

  <div class="app-shell"
       [class.sidebar-collapsed]="menuContraido()"
       [class.chat-route]="esRutaChat()">
    <kiert-navbar
      (estadoContraidoChange)="actualizarEstadoMenu($event)"
    ></kiert-navbar>

    <div class="app-main" [class.app-main--chat]="esRutaChat()">
      @if (!esRutaChat()) {
        <div class="main-banner">
          <div class="main-banner__content">
            <div class="main-banner__image">
              <img
                src="assets/images/anuncio/bannergoodlimpio.png"
                alt="Kiert Banner"
                loading="lazy"
                (error)="onBannerError($event)"
              >
            </div>

            <div class="main-banner__overlay">
              <h2>Unete a la comunidad</h2>
              <p>Comparte tus proyectos, aprende de otros y crece profesionalmente.
                Ayudanos a mejorar la pagina dando tus opiniones, eso nos ayudara a seguir mejorando la comunidad.
              </p>
              <a routerLink="/comunidad" class="main-banner__btn">
                Explorar ahora
              </a>
            </div>
          </div>
        </div>
      }

      <main class="main-content"
            [class.main-content--chat]="esRutaChat()"
            id="main-content"
            role="main"
            tabindex="-1">
        <router-outlet></router-outlet>
      </main>

      @if (!esRutaChat()) {
        <kiert-footer></kiert-footer>
        <kiert-floating-social></kiert-floating-social>
      }
    </div>
  </div>

  <!-- MODAL DE AYUDA DE ATAJOS (si lo tienes, va aqui) -->
</div>
